name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Settings used (preset, font, legibility, colour, paper, number of characters) and, if possible, the image.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
