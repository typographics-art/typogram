name: CI

# CI is switched off (operator, 2026-10-18): it runs only on manual dispatch, so pushes and pull requests no longer trigger
# it. The deterministic gate is run locally instead: `TG_SKIP_BROWSER=1 npm test`. Some newer tests (the tg CLI PDF path,
# the Python reference) need MuPDF/Python that the GitHub runner lacks. To turn CI back on, restore the two triggers below:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # The headless-browser and PDF tests (generator and work page, passkey page, browser key derivation, one-pager
      # round-trips through Chrome + MuPDF) are run locally; in CI they are skipped so the gate is deterministic.
      - run: npm test
        env:
          TG_SKIP_BROWSER: '1'
