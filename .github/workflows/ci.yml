name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # The headless-browser tests (generator and work page, passkey page, key derivation in a browser) and the PDF tests
      # need Chrome, MuPDF and qpdf; they skip with a message where those are missing. The runner has Chrome built in.
      - if: matrix.node == 22
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mupdf-tools qpdf
      - run: npm test
        env:
          CHROME_PATH: google-chrome
