# Publishes the app, the gallery and the Moby-Dick demonstrator to GitHub Pages; CNAME points it at typographics-art.org.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The Moby-Dick demonstrator's zoom tiles (~600 images) are generated here instead of living in git.
      # Ubuntu runners ship Google Chrome; the build script finds it on PATH.
      - name: Build demonstrator zoom tiles
        run: node demo/moby-dick/build.mjs zoom
      - name: Assemble site
        run: |
          mkdir -p _site/demo/moby-dick/out
          cp -r index.html gallery.html src gallery assets CNAME docs _site/
          rm _site/gallery/works.config.json
          cp demo/moby-dick/index.html demo/moby-dick/source.txt demo/moby-dick/proof.json demo/moby-dick/lines.json demo/moby-dick/preview.jpg _site/demo/moby-dick/
          cp -r demo/moby-dick/out/zoom _site/demo/moby-dick/out/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
