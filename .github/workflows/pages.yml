# Publishes the app, the gallery and the Moby-Dick demonstrator to GitHub Pages; CNAME points it at typographics-art.org.
name: Pages

# Manual only: the live site is served by Cloudflare (wrangler.jsonc). This workflow is the
# alternative host on GitHub Pages and needs Pages enabled for the repository.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      # The Moby-Dick demonstrator's zoom tiles (~600 images) are generated here instead of living in git.
      # Ubuntu runners ship Google Chrome; the build script finds it on PATH.
      - name: Build demonstrator zoom tiles
        run: node demo/moby-dick/build.mjs zoom
      - name: Assemble site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
