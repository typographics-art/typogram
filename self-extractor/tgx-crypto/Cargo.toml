[package]
name = "tgx-crypto"
version = "0.1.0"
edition = "2021"
description = "Pure decryption of the tg-art tgst1 encrypted-stream format (AES-256-GCM, HKDF-SHA-256)"
license = "MIT"
publish = false

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
hex = "=0.4.3"
