<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{--bg:#f4f4f1;--ink:#15171c;--muted:#5a6070;--accent:#b8145a;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#101217;--ink:#e8eaef;--muted:#a1a8b5;--accent:#ff5c9d;color-scheme:dark}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Roboto Flex',system-ui,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
.n{font-size:clamp(80px,18vw,180px);line-height:1;letter-spacing:-.02em}
.n span:nth-child(1){font-weight:150}.n span:nth-child(2){font-weight:550}.n span:nth-child(3){font-weight:1000;color:var(--accent)}
p{color:var(--muted);font-size:18px;max-width:40ch;margin:16px auto}
a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<main>
  <div class="n" aria-label="404"><span>4</span><span>0</span><span>4</span></div>
  <p>This page does not exist. Every letter of it would still be readable, if it did.</p>
  <p><a href="/">Typographics Art home</a> · <a href="/app">Make your own</a></p>
</main>
</body>
</html>
