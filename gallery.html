<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typographic Art Gallery</title>
<meta name="description" content="Works of Typographic Art, ASCII art for the age of AI: texts set character for character so that they form a picture, and stay readable for machines.">
<meta property="og:title" content="Typographic Art Gallery">
<meta property="og:image" content="https://tg-art.org/assets/social.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b8145a'/%3E%3Ctext x='4' y='24' font-family='sans-serif' font-size='21' font-weight='900' fill='white'%3ET%3C/text%3E%3Ctext x='18' y='24' font-family='sans-serif' font-size='15' font-weight='200' fill='white'%3Eg%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header, then a responsive grid of works; each card is preview, title, source, settings, links. */
:root{
  --bg:#e9ecf1; --panel:#ffffff; --fg:#15171c; --muted:#596070; --line:#d3d8e0; --accent:#b8145a;
  --f-ui:'Roboto Flex',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#111318;--panel:#1a1d24;--fg:#e7e9ee;--muted:#9aa1ae;--line:#2c313b;--accent:#ff5c9d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.page{max-width:1300px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{margin:0;font-size:30px;line-height:1.1;font-variation-settings:'wdth' 125,'opsz' 96;font-weight:850}
h1 span{font-weight:150;font-variation-settings:'wdth' 60,'opsz' 96}
h1 a{color:inherit;text-decoration:none}
header p{margin:0;color:var(--muted);max-width:70ch;flex:1 1 320px}
.nav{display:flex;gap:14px;margin-left:auto;font-size:14px;font-weight:600}
.nav a,.lang button{color:var(--fg)}
.nav a{text-decoration:none;border-bottom:1.5px solid var(--accent)}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:13px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card a.preview{display:block;background:var(--line);aspect-ratio:4/5;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s}
.card a.preview:hover img{transform:scale(1.04)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h2{margin:0;font-size:18px;font-variation-settings:'wdth' 110,'opsz' 36;font-weight:750}
.src{margin:0;color:var(--muted);font-size:13.5px}
.facts{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.links{display:flex;gap:12px;margin-top:auto;padding-top:6px;font-size:14px;font-weight:600}
.links a{color:var(--accent)}
.submit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.submit h2{margin:0 0 4px;font-size:18px}
.submit p{margin:0;max-width:70ch}
.submit a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card img{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1><a href="./">Typo<span>graphic Art</span></a></h1>
    <p data-i18n="intro">Each work is real text: open the SVG and select, copy or search it. The picture comes only from size, weight and colour of the letters.</p>
    <nav class="nav"><a href="demo/moby-dick/">Moby-Dick</a><a href="./" data-i18n="nav.make">Make your own</a><a href="https://github.com/typographic-art/tg-art">GitHub</a></nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <section class="submit">
    <h2 data-i18n="submit.h">Show your work</h2>
    <p><span data-i18n="submit.p">Made something with Typographic Art? Submit the SVG through an</span> <a href="https://github.com/typographic-art/tg-art/issues/new?template=artwork.yml" data-i18n="submit.link">artwork issue</a>.</p>
  </section>
</div>

<script type="module">
const T = {
  en: { characters: 'characters', filler: 'filler', fidelity: 'tone fidelity', svg: 'Open SVG (text)', preview: 'Preview' },
  de: {
    intro: 'Jedes Werk ist echter Text: Öffne das SVG und markiere, kopiere oder durchsuche ihn. Das Bild entsteht nur aus Grösse, Stärke und Farbe der Buchstaben.',
    'nav.make': 'Selbst gestalten', 'submit.h': 'Zeig dein Werk', 'submit.p': 'Etwas mit Typographic Art gemacht? Reiche das SVG über ein', 'submit.link': 'Werk-Issue ein',
    characters: 'Zeichen', filler: 'Fülltext', fidelity: 'Tontreue', svg: 'SVG öffnen (Text)', preview: 'Vorschau',
  },
};
const EN = new Map([...document.querySelectorAll('[data-i18n]')].map((el) => [el.dataset.i18n, el.textContent]));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let lang = 'en', works = [];
const t = (k) => T[lang][k] ?? T.en[k];
const fmt = (n) => n.toLocaleString(lang === 'de' ? 'de-CH' : 'en-US');

function render() {
  document.getElementById('grid').innerHTML = works.map((w) => `
    <article class="card">
      <a class="preview" href="${esc(w.svg)}"><img src="${esc(w.preview)}" alt="${esc(t('preview'))}: ${esc(w.title)}" loading="lazy"></a>
      <div class="body">
        <h2>${esc(w.title)}</h2>
        <p class="src">${esc(w.source)}</p>
        <div class="facts">
          <span>${fmt(w.meta.characters)} ${t('characters')}</span>
          ${w.meta.filler ? `<span>${fmt(w.meta.filler)} ${t('filler')}</span>` : ''}
          <span>${t('fidelity')} ${w.meta.toneFidelity.toFixed(2)}</span>
          <span>${esc(w.options.font)} · ${esc(w.options.legibility)} · ${esc(w.options.color)} · ${esc(w.options.paper || 'light')}</span>
        </div>
        <div class="links"><a href="${esc(w.svg)}">${t('svg')}</a></div>
      </div>
    </article>`).join('');
}
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const v = l === 'en' ? EN.get(el.dataset.i18n) : T.de[el.dataset.i18n];
    if (v != null) el.textContent = v;
  });
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  try { localStorage.setItem('tg-art.lang', l); } catch { /* not remembered */ }
  render();
}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
let initial = (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en';
try { initial = JSON.parse(localStorage.getItem('tg-art.v1') || '{}').lang || localStorage.getItem('tg-art.lang') || initial; } catch { /* default */ }
works = await (await fetch('gallery/works.json')).json();
setLang(initial);
</script>
</body>
</html>
